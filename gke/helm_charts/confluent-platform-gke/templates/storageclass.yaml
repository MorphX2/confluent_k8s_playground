## StorageClass – GKE pd-standard for budget clusters (avoids SSD quota limits).
## Switch type back to pd-ssd for production workloads.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: confluent-ssd
  namespace: {{ .Release.Namespace }}
provisioner: kubernetes.io/gce-pd
parameters:
  type: pd-standard
  replication-type: none        # zonal disk; use "regional-pd" for multi-zone HA
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
